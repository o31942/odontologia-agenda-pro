name: Install DentalFlow source
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-*.b64 | base64 --decode > /tmp/dentalflow-source.tar.xz
          echo "261e02ac8288238c8311a7a330ea8a18af47573a6aeec58a9875accade306067  /tmp/dentalflow-source.tar.xz" | sha256sum --check -
          tar -xJf /tmp/dentalflow-source.tar.xz -C .
          test -f app.py
          test -f requirements.txt
          test -f dentalflow/services.py
          test -f tests/test_services.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: python -m pip install -r requirements.txt pytest
      - name: Validate Python syntax
        run: python -m compileall -q app.py dentalflow tests
      - name: Run automated tests
        run: python -m pytest -q
      - name: Commit complete clean project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/**'
          git commit -m "feat: publish DentalFlow dental appointment management"
          git push origin HEAD:main
